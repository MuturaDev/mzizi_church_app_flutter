   - resources/esv.xml
   - resources/xml/
   - resources/raw/
   - assets/images/member_app_assets/jcc_logo.png
   - assets/images/member_app_assets/jcc_logo2.png
   - assets/images/member_app_assets/dashboard_home_bg.jpg
   - assets/images/member_app_assets/megaphone.png
   - assets/images/member_app_assets/Curve-Loading.gif
   - assets/images/member_app_assets/photo_gallery.png
   - assets/images/member_app_assets/church.png
   - assets/images/member_app_assets/church_logo_no_bg2.png
   - assets/images/member_app_assets/church_logo.jpeg 
   - assets/images/member_app_assets/mzizi_church_logo.png
   - assets/images/member_app_assets/jcc.png
   - assets/images/member_app_assets/dcik.png
   - assets/images/member_app_assets/bwmc.png
   - assets/images/member_app_assets/bible.png
