version: 3.0.1+3

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  line_icons: ^2.0.3
  carousel_slider: ^5.1.2
  youtube_player_flutter: ^10.0.2
  font_awesome_flutter: ^11.0.0

  # Networking / persistence (models and API client generated by build_runner)
  dio: ^5.11.1
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  sqflite: ^2.4.6
  http: ^1.6.0

  bubble: ^1.3.0
  fluttertoast: ^10.0.3
  enhanced_future_builder: ^2.0.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  path: ^1.9.1
  collection: ^1.19.1
  intl: ^0.20.3
  google_fonts: ^9.0.0
  transparent_image: ^2.0.1
  flutter_phoenix: ^1.1.1
  webview_flutter: ^4.14.1

  # Bible
  xml: ^7.1.0
  rxdart: ^0.28.0
  global_configuration: ^2.0.0
  flutter_slidable: ^5.2.0
  after_layout: ^1.2.0
  flutter_quill: ^11.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  json_serializable: ^6.15.2
  retrofit_generator: ^10.3.3


# For information on the generic Dart part of this file, see the
