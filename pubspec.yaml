name: mzizichurchsystem
description: Mzizi Church Mobile App.

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 3.0.1+3

environment:
  sdk: ">=2.10.0 <3.0.0"
  flutter: ">=3.0.0 <3.1.0"

dependencies:
  flutter:
    sdk: flutter

  # NOTE (fix/build-setup): the app code is still pre-null-safety (language
  # version 2.10), so it is built with Flutter 3.0.x using
  # `--no-sound-null-safety`. Plugins with native Android/iOS code were moved to
  # versions that compile against Flutter 3.0; pure-Dart packages the
  # generated code depends on (dio, retrofit, json_annotation, floor) were kept
  # at their original versions. Unused packages were removed.
  cupertino_icons: ^1.0.5
  line_icons: 0.2.0
  carousel_slider: ^4.1.1
  youtube_player_flutter: ^8.1.1
  font_awesome_flutter: 8.8.1

  # Networking / persistence (kept at original versions: generated *.g.dart
  # files were produced for these exact APIs)
  dio: 3.0.10
  retrofit: 1.0.0
  json_annotation: 2.3.0
  floor: 0.9.0
  sqflite: ^1.3.2
  http: ^0.13.5

  bubble: ^1.2.1
  fluttertoast: ^8.0.9
  enhanced_future_builder: 1.0.3
  shared_preferences: ^2.0.15
  url_launcher: ^6.1.5
  path_provider: ^2.0.11
  intl: 0.15.8
  flutter_money_formatter: 0.8.3
  dropdownfield: 0.0.2
  google_fonts: ^3.0.1
  transparent_image: ^2.0.0
  add_thumbnail: 0.0.2
  sweetalert: 0.0.1
  flutter_phoenix: ^1.1.0
  flutter_cupertino_date_picker: 1.0.26+2
  flutter_datetime_picker: ^1.5.1
  launch_review: ^3.0.1
  flutter_webview_plugin: ^0.4.0

  #BIBLE
  queries: 0.1.14
  xml: 3.6.1
  rxdart: 0.23.1
  global_configuration: ^2.0.0
  flutter_slidable: 0.5.7
  after_layout: ^1.2.0
  zefyr: 0.11.0
  material_design_icons_flutter: ^5.0.6595

dependency_overrides:
  # zefyr 0.11 (Bible notes editor) declares url_launcher ^5 but only calls
  # launch(), which url_launcher 6 still provides.
  url_launcher: ^6.1.5
  # dio 3.0.10 caps http_parser <4 but http 0.13 needs ^4; dio only uses
  # MediaType, which is unchanged in 4.x.
  http_parser: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generators (floor_generator, retrofit_generator, json_serializable,
  # build_runner) were removed: their 2020 versions do not run on Dart 2.17 and
  # the generated *.g.dart files are committed. Re-add compatible versions only
  # when regenerating code.


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
   - assets/cfg/
   # Sample API responses used only with --dart-define=MOCK_API=true
   - assets/mock_api/
